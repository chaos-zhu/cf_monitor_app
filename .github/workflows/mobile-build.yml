name: Build Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag, for example v1.2.3 or v1.2.3-beta.1'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  release-info:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tag must look like v1.2.3 or v1.2.3-beta.1' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    name: Signed Android APKs
    needs: [checks, release-info]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci/android_signing.py restore
      - name: Build release APKs
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
        run: flutter build apk --release --split-per-abi --no-pub --build-name "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK certificates
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci/android_signing.py verify
      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cf-monitor-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/cf-monitor-release.jks

  release:
    name: Publish GitHub Release
    needs: [release-info, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cf-monitor-android-${{ github.run_number }}
          path: release-apks
      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          apks=(release-apks/*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No release APKs found' >&2
            exit 1
          fi
          options=(--title "CFMonitor $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          if [[ "$EVENT_NAME" == 'push' ]]; then
            options+=(--verify-tag)
          else
            if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists; use a new tag for a manual release" >&2
              exit 1
            else
              status=$?
              if (( status != 2 )); then exit "$status"; fi
            fi
            options+=(--target "$TARGET_SHA")
          fi
          gh release create "$RELEASE_TAG" "${apks[@]}" "${options[@]}"
