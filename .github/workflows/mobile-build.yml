name: Build Android and iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  IOS_BUNDLE_ID: dev.cfmonitor.cfMonitorApp

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

  android:
    name: Signed Android APKs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci/android_signing.py restore
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --no-pub --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK certificates
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci/android_signing.py verify
      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cf-monitor-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/cf-monitor-release.jks

  ios:
    name: Signed iOS IPA
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use CocoaPods integration
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - name: Configure Apple signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 tools/ci/ios_signing.py prepare
      - name: Build signed IPA
        run: flutter build ipa --release --no-pub --build-number "$GITHUB_RUN_NUMBER" --export-options-plist "$RUNNER_TEMP/cf-monitor-signing/ExportOptions.plist"
      - name: Verify IPA signature
        run: python3 tools/ci/ios_signing.py verify
      - name: Upload IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cf-monitor-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Remove Apple signing material
        if: always()
        run: python3 tools/ci/ios_signing.py cleanup
